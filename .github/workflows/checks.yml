      - name: Prepare GNU public lifecycle and native package test executables
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/positron-source --remap-path-prefix=$RUNNER_TEMP/independent-source=/positron-source --remap-path-prefix=$RUNNER_TEMP/native-target=/positron-target"
          export CFLAGS="-fdebug-prefix-map=$GITHUB_WORKSPACE=/positron-source -fdebug-prefix-map=$RUNNER_TEMP/independent-source=/positron-source -fdebug-prefix-map=$RUNNER_TEMP/native-target=/positron-target"
          docker run --rm --user "$(id -u):$(id -g)" -e RUSTFLAGS -e CFLAGS -e CARGO_HOME=/cargo \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            -v "$RUNNER_TEMP/gnu-cargo:/cargo" -w "$GITHUB_WORKSPACE" positron-gnu-builder \
            cargo test --locked --release -p positron-release --target-dir "$RUNNER_TEMP/native-target" \
              --test linux_packages --no-run --message-format=json > "$RUNNER_TEMP/package-test-build.json"
          jq -r 'select(.executable != null and .profile.test == true) | .executable' "$RUNNER_TEMP/package-test-build.json" > "$RUNNER_TEMP/package-test-executable"
          docker run --rm --user "$(id -u):$(id -g)" -e RUSTFLAGS -e CFLAGS -e CARGO_HOME=/cargo \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            -v "$RUNNER_TEMP/gnu-cargo:/cargo" -w "$GITHUB_WORKSPACE" positron-gnu-builder \
            cargo test --locked --release -p positron --target-dir "$RUNNER_TEMP/native-target" \
              --test binary_ingestion --test restore_cli --test upgrade_native_cli --test release_cli --test compose_fixture \
              --no-run --message-format=json > "$RUNNER_TEMP/public-test-build.json"
          jq -r 'select(.executable != null and .profile.test == true) | .executable' "$RUNNER_TEMP/public-test-build.json" > "$RUNNER_TEMP/public-test-executables"
      - name: Qualify installed packages under booted native systemd on all Linux distributions
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package_test=$(cat "$RUNNER_TEMP/package-test-executable")
          for distribution in debian ubuntu fedora rocky; do
            case "$distribution" in
              debian) image=debian:12@sha256:2c037a04925515fdd6ea85ea14a682d0e79931f5e9f5d07b6dbfc6ba12f9e858; kind=deb;;
              ubuntu) image=ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac; kind=deb;;
              fedora) image=fedora:43@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42; kind=rpm;;
              rocky) image=rockylinux/rockylinux:9.6@sha256:91bbb8eb52ca462611c1f9ce5c4cede4172a31bfe64f336e82f29648694a3cfe; kind=rpm;;
            esac
            docker build --tag "positron-test-$distribution" --file deploy/linux/Dockerfile.test \
              --build-arg "RUNTIME_IMAGE=$image" --build-arg "FIXTURE_UID=$(id -u)" deploy/linux
            if [ "$kind" = rpm ]; then package=$(find "$RUNNER_TEMP/rpm-signed" -type f); else package=$(find "$RUNNER_TEMP/deb-first" -type f); fi
            container="positron-package-$distribution"
            docker run -d --name "$container" --privileged --cgroupns=private \
              --tmpfs /run --tmpfs /run/lock \
              -v "$container-temp:/tmp" -v "$container-data:/var/lib/positron" \
              -v "$container-secrets:/var/lib/positron-secrets" \
              -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" -v "$RUNNER_TEMP:$RUNNER_TEMP:ro" \
              -e POSITRON_TEST_PACKAGE="$package" -e POSITRON_TEST_ARCHIVE="$RUNNER_TEMP/first/native.tar.gz" \
              -e POSITRON_TEST_RPM_KEY="$RUNNER_TEMP/fixture-rpm-public.asc" \
              -e POSITRON_TEST_NATIVE_BINARY=/usr/bin/positron "positron-test-$distribution"
            trap 'docker exec "$container" journalctl -u positron.service --no-pager -n 80 || true; docker rm -f "$container"; docker volume rm "$container-temp" "$container-data" "$container-secrets"' EXIT
            for attempt in $(seq 1 60); do
              state=$(docker exec "$container" systemctl is-system-running || true)
              case "$state" in running|degraded) break;; esac
              test "$attempt" != 60
              sleep 1
            done
            docker exec "$container" systemctl set-property init.scope CPUWeight=100
            docker exec "$container" cat /etc/os-release
            docker exec "$container" uname -r
            docker exec "$container" systemctl --version
            if [ "$kind" = deb ]; then
              docker exec "$container" dpkg-query -W libc6 libc-bin libgcc-s1 coreutils ca-certificates passwd systemd util-linux
            else
              docker exec "$container" rpm -q glibc glibc-common libgcc coreutils ca-certificates systemd util-linux shadow-utils
            fi
            docker exec "$container" "$package_test" --ignored --exact \
              native_manager_installs_exact_payload_and_retains_owner_configuration_data_and_keys
            docker exec "$container" "$package_test" --ignored --exact \
              systemd_unit_initializes_explicitly_runs_non_root_and_drains_before_restart
            while IFS= read -r executable; do
              docker exec "$container" runuser -u fixture -- "$executable" --test-threads=1
            done < "$RUNNER_TEMP/public-test-executables"
            docker rm -f "$container"
            docker volume rm "$container-temp" "$container-data" "$container-secrets"
            trap - EXIT
          done
      - name: Build native OCI payloads twice without publication
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker buildx create --name positron-oci --driver docker-container --driver-opt image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea --use
          mkdir -p "$RUNNER_TEMP/oci/one" "$RUNNER_TEMP/oci/two"
          cp "$RUNNER_TEMP/first/native.tar.gz" "$RUNNER_TEMP/oci/one/native.tar.gz"
          cp "$RUNNER_TEMP/rebuilt-native.tar.gz" "$RUNNER_TEMP/oci/two/native.tar.gz"
          for build in one two; do
            cp deploy/oci/MPL-2.0.txt "$RUNNER_TEMP/oci/$build/"
            docker buildx build --no-cache --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH=0 \
              --output "type=oci,dest=$RUNNER_TEMP/oci/$build/image.tar,compression=uncompressed" \
              --file deploy/oci/Dockerfile "$RUNNER_TEMP/oci/$build"
          done
          POSITRON_TEST_OCI_ARCHIVE="$RUNNER_TEMP/first/native.tar.gz" python3 deploy/oci/test_image.py
          for build in one two; do
            capture="$RUNNER_TEMP/oci/$build"
            cp Cargo.lock rust-toolchain.toml "$capture/"
            date -u +%Y-%m-%dT%H:%M:%SZ > "$capture/created.txt"
            echo "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.target }}-$build" > "$capture/build-identity.txt"
            docker run --rm positron-gnu-builder rustc -vV > "$capture/toolchain.txt"
            docker run --rm positron-gnu-builder rpm -q glibc gcc binutils perl-interpreter git-core >> "$capture/toolchain.txt"
            if [ "$build" = one ]; then cp "$RUNNER_TEMP/native-first-flags.txt" "$capture/native-build-flags.txt"; else cp "$RUNNER_TEMP/native-second-flags.txt" "$capture/native-build-flags.txt"; fi
            docker buildx version > "$capture/build-tools.txt"
            docker buildx inspect --bootstrap >> "$capture/build-tools.txt"
            docker run --rm rockylinux/rockylinux:9.6@sha256:91bbb8eb52ca462611c1f9ce5c4cede4172a31bfe64f336e82f29648694a3cfe \
              rpm -q --qf '%{NAME}\t%{VERSION}-%{RELEASE}\t%{LICENSE}\n' glibc libgcc > "$capture/runtime-packages.txt"
            cargo metadata --locked --format-version 1 > "$capture/cargo-metadata.json"
            POSITRON_TEST_OCI_CAPTURE="$capture" cargo test --locked -p positron-release --lib \
              build_qualification::oci::capture_oci_build_metadata -- --ignored --exact
            rm "$capture/native.tar.gz"
          done
      - name: Run the OCI retained-record flow and actual Compose lifecycle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          executable=$(jq -r 'select(.target.name == "binary_ingestion" and .executable != null and .profile.test == true) | .executable' "$RUNNER_TEMP/public-test-build.json")
          source_commit=$(git rev-parse HEAD)
          candidate="$RUNNER_TEMP/native-target/tmp/native-upgrade-fixture/native-release-v1/$source_commit"
          test -f "$candidate/target/release/positron"
          docker create --name positron-oci-tools positron-gnu-builder
          docker cp positron-oci-tools:/bin/kill "$RUNNER_TEMP/oci-kill"
          docker rm positron-oci-tools
          docker volume create positron-oci-test-temp
          docker run --rm -v positron-oci-test-temp:/tmp positron-gnu-builder chmod 1777 /tmp
          docker run --rm --read-only --user "$(id -u):$(id -g)" \
            --tmpfs "/run/positron:uid=$(id -u),gid=$(id -g),mode=0700" \
            -v positron-oci-test-temp:/tmp \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" -v "$RUNNER_TEMP:$RUNNER_TEMP:ro" \
            -v "$RUNNER_TEMP/oci-kill:/bin/kill:ro" \
            -e POSITRON_TEST_NATIVE_BINARY=/usr/bin/positron \
            -e "POSITRON_TEST_UPGRADE_BINARY=$candidate/target/release/positron" \
            -e "POSITRON_TEST_SOURCE_COMMIT=$source_commit" \
            -e "POSITRON_TEST_CANDIDATE_COMMIT=$(cat "$candidate/candidate-commit")" \
            --entrypoint "$executable" positron-118-test --exact \
            binary_http_ingestion_recovers_after_sigkill_and_graceful_restart --test-threads=1
          docker volume rm positron-oci-test-temp
          python3 deploy/compose/test_tls.py
          compose_fixture=$(jq -r 'select(.target.name == "compose_fixture" and .executable != null and .profile.test == true) | .executable' "$RUNNER_TEMP/public-test-build.json")
          "$compose_fixture" --ignored --exact compose_query_consumer_uses_canonical_protojson
          POSITRON_TEST_COMPOSE_HELPER="$compose_fixture" \
          POSITRON_TEST_OCI_IMAGE=positron-118-test \
          POSITRON_TEST_UPGRADE_BINARY="$candidate/target/release/positron" \
          POSITRON_TEST_SOURCE_COMMIT="$source_commit" \
          POSITRON_TEST_CANDIDATE_COMMIT="$(cat "$candidate/candidate-commit")" \
            python3 deploy/compose/test_compose.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Linux'
        with:
          name: oci-${{ matrix.target }}
          path: ${{ runner.temp }}/oci/
          retention-days: 7
      - name: Run maintained-minor isolated standalone Helm native lifecycles
        if: runner.os == 'Linux'
        timeout-minutes: 180
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.target }}' in
            linux-x86_64) architecture=amd64; helm_sha=9adafecab4d406853bba163a70e9f104f47dbbf65ce24b7653bae7e36150bcb6; kind_sha=aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d; k3d_sha=06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0;;
            linux-aarch64) architecture=arm64; helm_sha=78803142087a0069fa4b50d3f32a84d3ef25c14d1ee8a40fbccf86a6216d2f36; kind_sha=20022bee6cfcd5086cb7234d218e3454e6090022f2a8f55d1fa7fcf42c3867a2; k3d_sha=03cde5cf23e6e8e67de5a039ecf26e5b85aca82fba3e5d13dadf904cd218a250;;
            *) exit 2;;
          esac
          mkdir -p "$RUNNER_TEMP/helm-tools" "$RUNNER_TEMP/helm-candidate"
          curl --fail --location --silent --show-error "https://get.helm.sh/helm-v4.2.2-linux-$architecture.tar.gz" --output "$RUNNER_TEMP/helm-tools/helm.tar.gz"
          echo "$helm_sha  $RUNNER_TEMP/helm-tools/helm.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/helm-tools/helm.tar.gz" -C "$RUNNER_TEMP/helm-tools"
          curl --fail --location --silent --show-error "https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-$architecture" --output "$RUNNER_TEMP/helm-tools/kind"
          echo "$kind_sha  $RUNNER_TEMP/helm-tools/kind" | sha256sum --check
          curl --fail --location --silent --show-error "https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-$architecture" --output "$RUNNER_TEMP/helm-tools/k3d"
          echo "$k3d_sha  $RUNNER_TEMP/helm-tools/k3d" | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/helm-tools/kind" "$RUNNER_TEMP/helm-tools/k3d"
          export PATH="$RUNNER_TEMP/helm-tools:$RUNNER_TEMP/helm-tools/linux-$architecture:$PATH"
          POSITRON_TEST_SOURCE_COMMIT="$(git rev-parse HEAD)"
          candidate="$RUNNER_TEMP/native-target/tmp/native-upgrade-fixture/native-release-v1/$POSITRON_TEST_SOURCE_COMMIT"
          export POSITRON_TEST_UPGRADE_BINARY="$candidate/target/release/positron"
          POSITRON_TEST_CANDIDATE_COMMIT="$(cat "$candidate/candidate-commit")"
          export POSITRON_TEST_HELM_CURRENT_BINARY="$RUNNER_TEMP/first/positron"
          POSITRON_TEST_HELM_FIXTURE_HELPER="$(jq -r 'select(.target.name == "compose_fixture" and .executable != null and .profile.test == true) | .executable' "$RUNNER_TEMP/public-test-build.json")"
          export POSITRON_TEST_SOURCE_COMMIT POSITRON_TEST_CANDIDATE_COMMIT POSITRON_TEST_HELM_FIXTURE_HELPER
          export POSITRON_TEST_HELM_FIXTURE_BUILDER=positron-gnu-builder
          POSITRON_TEST_HELM_QUERY_IMAGE="$(docker image inspect --format '{{.Id}}' positron-118-test)"
          export POSITRON_TEST_HELM_QUERY_IMAGE
          export POSITRON_TEST_HELM_ARCHITECTURE="$architecture"
          [[ "$POSITRON_TEST_HELM_QUERY_IMAGE" =~ ^sha256:[a-f0-9]{64}$ ]]
          test -x "$POSITRON_TEST_HELM_CURRENT_BINARY"
          test -x "$POSITRON_TEST_UPGRADE_BINARY"
          test -x "$POSITRON_TEST_HELM_FIXTURE_HELPER"
          "$POSITRON_TEST_HELM_CURRENT_BINARY" release archive --target '${{ matrix.target }}' --binary "$POSITRON_TEST_UPGRADE_BINARY" --out "$RUNNER_TEMP/helm-candidate/native.tar.gz"
          cp deploy/oci/MPL-2.0.txt "$RUNNER_TEMP/helm-candidate/"
          docker buildx build --load --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH=0 --file deploy/oci/Dockerfile --tag positron-120-candidate "$RUNNER_TEMP/helm-candidate"
          python3 -m pip install --break-system-packages 'PyYAML==6.0.3'
          python3 deploy/helm/test_native_adapter.py
          helm version --short
          kind version
          k3d version
          sha256sum "$POSITRON_TEST_HELM_CURRENT_BINARY" "$POSITRON_TEST_UPGRADE_BINARY" "$POSITRON_TEST_HELM_FIXTURE_HELPER"
          # Official tool checksums: kind v0.33.0 *.sha256sum; k3d v5.9.0 checksums.txt.
          # Node indices: kind v0.33.0 release; rancher/k3s multi-platform registry indices.
          cell=0
          while read -r runtime version digest; do
            cell=$((cell + 1))
            cluster="positron-120-$(printf '%s' "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$architecture" | sha256sum | cut -c1-10)-$cell"
            cell_dir="$RUNNER_TEMP/helm-$cell"
            mkdir -m 700 "$cell_dir"
            export POSITRON_TEST_KUBECONFIG="$cell_dir/kubeconfig"
            export KUBECONFIG="$POSITRON_TEST_KUBECONFIG"
            export POSITRON_TEST_HELM_CONTEXT="$runtime-$cluster"
            export POSITRON_TEST_HELM_INDEX_FILE="$cell_dir/runtime-image-index.json"
            export POSITRON_TEST_HELM_CHART_OUT="$cell_dir/positron-runtime.tgz"
            export POSITRON_TEST_HELM_CHART="$POSITRON_TEST_HELM_CHART_OUT"
            printf '%s %s %s\n' "$runtime" "$cluster" "$cell_dir" > "$RUNNER_TEMP/helm-active-cell"
            port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
            volume="$cluster-storage"
            if [ "$runtime" = kind ]; then
              export POSITRON_TEST_HELM_STORAGE_CLASS=standard
              node_image="kindest/node:$version@sha256:$digest"
              cat > "$cell_dir/cluster.yaml" <<EOF
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          networking:
            apiServerAddress: 127.0.0.1
            apiServerPort: $port
          nodes:
            - role: control-plane
              labels:
                positron.io/test-owner: $cluster
          EOF
              if [ "$cell" = 1 ]; then
                cat >> "$cell_dir/cluster.yaml" <<EOF
            - role: worker
              labels:
                positron.io/test-owner: $cluster
          EOF
              fi
              kind create cluster --name "$cluster" --kubeconfig "$KUBECONFIG" --config "$cell_dir/cluster.yaml" --image "$node_image" --wait 180s
              kind load docker-image positron-118-test positron-120-candidate --name "$cluster"
              mapfile -t nodes < <(kind get nodes --name "$cluster")
              node="$cluster-control-plane"
              ctr=(docker exec "$node" ctr --namespace k8s.io)
            else
              export POSITRON_TEST_HELM_STORAGE_CLASS=local-path
              node_image="rancher/k3s:$version@sha256:$digest"
              docker volume create --label "positron.io/test-owner=$cluster" "$volume"
              k3d cluster create "$cluster" --image "$node_image" --servers 1 --agents 0 --api-port "127.0.0.1:$port" --volume "$volume:/var/lib/rancher/k3s/storage@server:0" --runtime-label "positron.io/test-owner=$cluster@server:0" --kubeconfig-update-default=false --kubeconfig-switch-context=false --wait --timeout 180s
              k3d kubeconfig get "$cluster" > "$KUBECONFIG"
              chmod 600 "$KUBECONFIG"
              k3d image import positron-118-test positron-120-candidate --cluster "$cluster"
              node="k3d-$cluster-server-0"
              nodes=("$node")
              ctr=(docker exec "$node" /bin/ctr --address /run/k3s/containerd/containerd.sock --namespace k8s.io)
              docker exec "$node" stat -f -c %T /var/lib/rancher/k3s/storage | grep -Ex 'ext2/ext3|xfs|btrfs|zfs'
            fi
            current_digest="$("${ctr[@]}" images list | awk '$1 == "docker.io/library/positron-118-test:latest" { print $3 }')"
            candidate_digest="$("${ctr[@]}" images list | awk '$1 == "docker.io/library/positron-120-candidate:latest" { print $3 }')"
            [[ "$current_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            [[ "$candidate_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            export POSITRON_TEST_HELM_IMAGE="ghcr.io/vicotrbb/positron@$current_digest"
            export POSITRON_TEST_HELM_CANDIDATE_IMAGE="ghcr.io/vicotrbb/positron@$candidate_digest"
            for node in "${nodes[@]}"; do
              if [ "$runtime" = kind ]; then
                ctr=(docker exec "$node" ctr --namespace k8s.io)
              else
                ctr=(docker exec "$node" /bin/ctr --address /run/k3s/containerd/containerd.sock --namespace k8s.io)
              fi
              test "$("${ctr[@]}" images list | awk '$1 == "docker.io/library/positron-118-test:latest" { print $3 }')" = "$current_digest"
              test "$("${ctr[@]}" images list | awk '$1 == "docker.io/library/positron-120-candidate:latest" { print $3 }')" = "$candidate_digest"
              "${ctr[@]}" images tag --force docker.io/library/positron-118-test:latest "$POSITRON_TEST_HELM_IMAGE"
              "${ctr[@]}" images tag --force docker.io/library/positron-120-candidate:latest "$POSITRON_TEST_HELM_CANDIDATE_IMAGE"
              "${ctr[@]}" content get "$current_digest" | head -c 1048577 > "$POSITRON_TEST_HELM_INDEX_FILE"
            done
            manifest_digest="$(PYTHONPATH=deploy/helm python3 -c 'import os; from native_lifecycle import query_image_descriptor; print(query_image_descriptor(os.environ["POSITRON_TEST_HELM_IMAGE"], os.environ["POSITRON_TEST_HELM_INDEX_FILE"], os.environ["POSITRON_TEST_HELM_ARCHITECTURE"])[1]["digest"])')"
            if [ "$manifest_digest" != "$current_digest" ]; then
              "${ctr[@]}" content get "$manifest_digest" | head -c 1048577 > "$cell_dir/query-manifest-${manifest_digest#sha256:}.json"
            fi
            PYTHONPATH=deploy/helm python3 -c 'import json, os; from native_lifecycle import checked_query_image; print(json.dumps({"node_image": os.environ["POSITRON_TEST_HELM_IMAGE"], "host_image": checked_query_image(os.environ["POSITRON_TEST_HELM_IMAGE"], timeout=10), "architecture": os.environ["POSITRON_TEST_HELM_ARCHITECTURE"]}))' > "$cell_dir/query-image-binding.json"
            cargo test --locked -p positron-release --test helm prepare_runtime_helm_fixture -- --ignored --exact
            test -s "$POSITRON_TEST_HELM_CHART"
            python3 deploy/helm/test_chart.py
            test -s "$POSITRON_TEST_HELM_INDEX_FILE"
            test -n "$POSITRON_TEST_HELM_CANDIDATE_IMAGE"
            kubectl --kubeconfig "$KUBECONFIG" version --output=json
            kubectl --kubeconfig "$KUBECONFIG" get nodes --output=json
            kubectl --kubeconfig "$KUBECONFIG" get storageclass "$POSITRON_TEST_HELM_STORAGE_CLASS" --output=json
            printf 'runtime=%s version=%s node_image=%s source=%s candidate=%s current_image=%s candidate_image=%s\n' "$runtime" "$version" "$node_image" "$POSITRON_TEST_SOURCE_COMMIT" "$POSITRON_TEST_CANDIDATE_COMMIT" "$current_digest" "$candidate_digest"
            python3 deploy/helm/test_kubernetes.py KubernetesLifecycle.test_native_upgrade_preserves_verified_data_and_drain
            if [ "$cell" = 1 ]; then
              export POSITRON_TEST_HELM_INTERRUPTION_CONTROL_PLANE="$cluster-control-plane"
              test -n "$POSITRON_TEST_HELM_INTERRUPTION_CONTROL_PLANE"
              python3 deploy/helm/test_kubernetes.py KubernetesLifecycle.test_native_api_outage_eviction_and_local_path_drain
              unset POSITRON_TEST_HELM_INTERRUPTION_CONTROL_PLANE
            fi
            if [ "$runtime" = kind ]; then
              kind delete cluster --name "$cluster" --kubeconfig "$KUBECONFIG"
            else
              k3d cluster delete "$cluster"
              docker volume rm "$volume"
            fi
            rm "$RUNNER_TEMP/helm-active-cell"
          done <<'EOF'
          kind v1.37.0 a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          kind v1.36.4 099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          kind v1.35.8 07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          k3d v1.37.1-k3s1 ca7f37d993d82ef0dcdcfecb2e0e2618ea541dbaffc620c8cedebe01a82acd0d
          k3d v1.36.5-k3s1 057cfd5a9d51b89f1f0ee139c28d5d5fdd5aa7ddeac2742a0ba90c6dbc0329bb
          k3d v1.35.9-k3s1 ec9868c6a38d4e8c1869832fb5fd1eb8473c39794a0b44d2b952e7ba911951bc
          EOF
      - name: Preserve public runtime OCI descriptors
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helm-runtime-descriptors-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/helm-*/runtime-image-index.json
            ${{ runner.temp }}/helm-*/query-manifest-*.json
            ${{ runner.temp }}/helm-*/query-image-binding.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Inspect and remove owned isolated Helm cell
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/helm-active-cell" ]; then
            read -r runtime cluster cell_dir < "$RUNNER_TEMP/helm-active-cell"
            export KUBECONFIG="$cell_dir/kubeconfig"
            # Metadata only: no Secrets, mounted payloads, or application logs.
            kubectl --kubeconfig "$KUBECONFIG" get nodes,storageclasses --output=wide || true
            kubectl --kubeconfig "$KUBECONFIG" get pods,statefulsets,pvc,events --all-namespaces --output=wide || true
            if [ "$runtime" = kind ]; then
              "$RUNNER_TEMP/helm-tools/kind" delete cluster --name "$cluster" --kubeconfig "$KUBECONFIG"
            else
              "$RUNNER_TEMP/helm-tools/k3d" cluster delete "$cluster"
              if docker volume inspect "$cluster-storage" >/dev/null 2>&1; then docker volume rm "$cluster-storage"; fi
            fi
          fi
      - name: Remove private GNU lifecycle volume
        if: always() && runner.os == 'Linux'
        run: |
          if docker volume inspect positron-gnu-native-temp >/dev/null 2>&1; then
            docker volume rm positron-gnu-native-temp
          fi

  oci-index:
    name: Offline multi-architecture OCI index and Release Trust
    needs: native-archives
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: oci-*
          path: native
      - name: Assemble both native layouts offline without executing foreign code
        shell: bash
        run: |
          docker buildx create --name positron-oci --driver docker-container --driver-opt image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea --use
          for build in one two; do
            mkdir -p "native/$build/amd64" "native/$build/arm64"
            tar -xf "native/oci-linux-x86_64/$build/image.tar" -C "native/$build/amd64"
            tar -xf "native/oci-linux-aarch64/$build/image.tar" -C "native/$build/arm64"
            docker buildx build --no-cache --platform linux/amd64,linux/arm64 \
              --build-context "native-amd64=oci-layout://$PWD/native/$build/amd64" \
              --build-context "native-arm64=oci-layout://$PWD/native/$build/arm64" \
              --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH=0 \
              --output "type=oci,dest=$PWD/native/index-$build.tar,compression=uncompressed" \
              --file deploy/oci/Dockerfile.index deploy/oci
            echo "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-oci-index-$build" > "native/index-$build-build-identity.txt"
          done
      - name: Verify actual index images independent bytes and private offline trust bindings
        env:
          POSITRON_TEST_OCI_INDEX: ${{ github.workspace }}/native/index-one.tar
          POSITRON_TEST_OCI_INDEX_REBUILD: ${{ github.workspace }}/native/index-two.tar
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          cargo test --locked -p positron-release --test built_oci -- --ignored
          POSITRON_TEST_OCI_CAPTURES="$PWD/native" \
          POSITRON_TEST_OCI_METADATA_OUT="$PWD/oci-metadata" \
            cargo test --locked -p positron-release --lib \
            build_qualification::oci::actual_oci_metadata_is_bound_offline_to_current_build -- --ignored --exact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oci-multiarchitecture-qualified-payloads
          path: |
            native/index-*.tar
            oci-metadata/
          retention-days: 7
