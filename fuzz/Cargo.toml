[package]
name = "positron-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
age = "=0.11.5"
libfuzzer-sys = "0.4"
opentelemetry-proto = { version = "=0.32.0", default-features = false, features = ["gen-tonic-messages", "logs", "trace"] }
positron-api = { path = "../crates/positron-api" }
positron-config = { path = "../crates/positron-config" }
positron-kernel = { path = "../crates/positron-kernel", features = ["test-support"] }
positron-domain = { path = "../crates/positron-domain" }
positron-governance = { path = "../crates/positron-governance" }
positron-policy = { path = "../crates/positron-policy" }
positron-ingest = { path = "../crates/positron-ingest" }
positron-runtime = { path = "../crates/positron-runtime", features = ["test-support"] }
positron-signals = { path = "../crates/positron-signals" }
positron-query = { path = "../crates/positron-query" }
positron = { path = "../crates/positron" }
prost = "=0.14.3"

[[bin]]
name = "live_bundle_request"
path = "fuzz_targets/live_bundle_request.rs"
