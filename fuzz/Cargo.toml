[package]
name = "positron-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[patch.crates-io]
sigstore-tsa = { path = "../vendor/sigstore-tsa-0.15.0" }
azure_identity = { path = "../vendor/azure_identity-1.0.0" }
azure_core = { path = "../vendor/azure_core-1.0.0" }
typespec = { path = "../vendor/typespec-1.1.0" }
aws-types = { path = "../vendor/aws-types-1.6.0" }
aws-config = { path = "../vendor/aws-config-1.12.0" }
google-cloud-auth = { path = "../vendor/google-cloud-auth-1.17.0" }
reqwest = { path = "../vendor/reqwest-0.12.28" }
ring = { path = "../vendor/ring-0.17.14" }

[dependencies]
crc32fast = "=1.5.0"
positron-release = { path = "../crates/positron-release" }
pgp = { version = "=0.21.0", default-features = false }
signed_note = "=0.2.0"
cms = { version = "=0.2.3", default-features = false }
x509-cert = "=0.2.5"
sigstore-verify = { version = "=0.15.0", default-features = false, features = ["aws-lc-rs"] }
zip = { version = "=9.0.4", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
base64 = "=0.22.1"
ring = { version = "=0.17.14", default-features = false }
rand = "0.8.5"
sha2 = "0.10.9"
serde_json = "=1.0.150"
tar = { version = "=0.4.46", default-features = false }
rcgen = { version = "=0.13.2", default-features = false, features = ["aws_lc_rs", "pem"] }
age = "=0.11.5"
libfuzzer-sys = "0.4"
opentelemetry-proto = { version = "=0.32.0", default-features = false, features = ["gen-tonic-messages", "logs", "trace"] }
positron-backup = { path = "../crates/positron-backup", features = ["test-support"] }
positron-api = { path = "../crates/positron-api" }
positron-config = { path = "../crates/positron-config" }
positron-kernel = { path = "../crates/positron-kernel", features = ["test-support"] }
positron-domain = { path = "../crates/positron-domain" }
positron-governance = { path = "../crates/positron-governance" }
positron-policy = { path = "../crates/positron-policy" }
positron-ingest = { path = "../crates/positron-ingest" }
positron-runtime = { path = "../crates/positron-runtime", features = ["test-support"] }
positron-signals = { path = "../crates/positron-signals" }
positron-query = { path = "../crates/positron-query" }
positron = { path = "../crates/positron" }
prost = "=0.14.3"

