[package]
name = "positron-kernel"
description = "Positron storage-kernel scaffold"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
autotests = false

[features]
default = []
test-support = []

[dependencies]
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc", "zeroize"] }
aes-kw = { version = "=0.3.1", default-features = false, features = ["zeroize"] }
getrandom = { version = "=0.4.3", default-features = false }
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
positron-domain = { path = "../positron-domain" }
ring = { version = "=0.17.14", default-features = false }
region = "=3.0.2"
rustix = { version = "1.1.4", default-features = false, features = ["fs", "process", "std", "system"] }
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[target.'cfg(target_os = "macos")'.dependencies]
positron-darwin-acl = { path = "../positron-darwin-acl" }
positron-darwin-system = { path = "../positron-darwin-system" }

[[test]]
name = "primary_data_volume"
path = "tests/primary_data_volume.rs"

[[test]]
name = "primary_data_volume_process"
path = "tests/primary_data_volume_process.rs"
harness = false

[[test]]
name = "resource_environment_observation"
path = "tests/resource_environment_observation.rs"

[[test]]
name = "resource_governor_integration"
path = "tests/resource_governor_integration.rs"

[[test]]
name = "catalog_generation"
path = "tests/catalog_generation.rs"

[[test]]
name = "active_segment_ledger"
path = "tests/active_segment_ledger.rs"

[[test]]
name = "export_output"
path = "tests/export_output.rs"

[[test]]
name = "key_provider"
path = "tests/key_provider.rs"

[lints]
workspace = true
