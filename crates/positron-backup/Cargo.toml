[package]
name = "positron-backup"
description = "Positron backup Repository provider behavior"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[features]
test-support = ["dep:tempfile", "positron-kernel/test-support"]

[dependencies]
positron-domain = { path = "../positron-domain" }
positron-kernel = { path = "../positron-kernel" }
async-trait = "=0.1.89"
aws-sdk-s3 = { version = "=1.152.0", default-features = false, features = ["http-1x", "rt-tokio"] }
aws-config = { version = "=1.12.0", default-features = false, features = ["rt-tokio", "credentials-process", "sso"] }
aws-smithy-http-client = { version = "=1.5.0", default-features = false, features = ["rustls-ring", "rt-tokio"] }
aws-smithy-runtime-api = { version = "=1.19.0", features = ["client", "http-1x"] }
http-body-util = "=0.1.5"
aws-smithy-types = { version = "=1.8.1", features = ["http-body-1-x"] }
getrandom = "=0.4.3"
tempfile = { version = "=3.27.0", optional = true }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "process", "std"] }
tracing = "=0.1.44"
sha2 = { version = "=0.11.0", default-features = false }
google-cloud-auth = { version = "=1.17.0", default-features = false }
http = "=1.5.0"
serde_json = "=1.0.150"
zeroize = "=1.9.0"
base64 = "=0.22.1"
crc32c = "=0.6.8"
time = { version = "=0.3.55", default-features = false, features = ["parsing"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "time", "io-util"] }

[dev-dependencies]
bytes = "=1.12.1"
http-body = "=1.1.0"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt"] }

[lints]
workspace = true
