[package]
name = "positron-backup"
description = "Positron backup Repository provider behavior"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[features]
test-support = ["dep:tempfile"]

[dependencies]
async-trait = "=0.1.89"
getrandom = "=0.4.3"
tempfile = { version = "=3.27.0", optional = true }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "process", "std"] }
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "time"] }

[dev-dependencies]
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt"] }

[lints]
workspace = true
