[package]
name = "positron-release"
description = "Offline construction and verification of the Positron release set"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
positron-config = { path = "../positron-config" }
rsa = { version = "=0.9.10", default-features = false }
pgp = { version = "=0.21.0", default-features = false }
signed_note = "=0.2.0"
sigstore-merkle = { version = "=0.15.0", default-features = false }
der = { version = "=0.7.10", features = ["derive"] }
roxmltree = "=0.21.1"
cms = { version = "=0.2.3", default-features = false }
x509-cert = "=0.2.5"
rustls-webpki = { version = "=0.103.15", default-features = false, features = ["std"] }
rustls-pki-types = "=1.15.1"
sigstore-verify = { version = "=0.15.0", default-features = false, features = ["aws-lc-rs"] }
tar = { version = "=0.4.46", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
zip = { version = "=9.0.4", default-features = false }
crc32fast = "=1.5.0"
base64 = "=0.22.1"
positron-kernel = { path = "../positron-kernel" }
ring = { version = "=0.17.14", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "0.10.9"
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std", "process"] }

toml = { version = "=1.1.4", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
rand = "0.8.5"
rcgen = { version = "=0.13.2", default-features = false, features = ["aws_lc_rs", "pem"] }

[lints]
workspace = true
