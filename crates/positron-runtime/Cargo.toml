[package]
name = "positron-runtime"
description = "Positron process runtime and transactional instance bootstrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[features]
test-support = [
    "positron-kernel/test-support",
    "positron-query/test-support",
    "positron-signals/test-support",
]

[dependencies]
age = { version = "=0.11.5", default-features = false }
bytes = "=1.12.1"
flate2 = { version = "=1.0.24", default-features = false, features = ["rust_backend"] }
http-body = "=1.1.0"
http = { version = "=1.5.0", default-features = false }
hyper = { version = "=1.11.1", default-features = false, features = ["http1", "http2", "server"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["server-auto", "tokio"] }
opentelemetry-proto = { version = "=0.32.0", default-features = false, features = ["gen-tonic", "logs", "trace", "with-serde"] }
positron-api = { path = "../positron-api" }
positron-config = { path = "../positron-config" }
positron-domain = { path = "../positron-domain" }
positron-governance = { path = "../positron-governance" }
positron-ingest = { path = "../positron-ingest" }
positron-kernel = { path = "../positron-kernel" }
positron-policy = { path = "../positron-policy" }
positron-query = { path = "../positron-query" }
positron-signals = { path = "../positron-signals" }
prost = "=0.14.3"
serde_json = "=1.0.149"
sha2 = { version = "=0.11.0", default-features = false }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "net", "process", "std"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "=1.53.1", default-features = false, features = ["net", "rt", "time"] }
tokio-rustls = { version = "=0.26.5", default-features = false }
tokio-stream = { version = "=0.1.19", default-features = false, features = ["net"] }
tonic = { version = "=0.14.6", default-features = false, features = ["gzip", "router", "transport", "tls-ring"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
positron-kernel = { path = "../positron-kernel", features = ["test-support"] }
async-trait = "=0.1.89"
h2 = "=0.4.16"
opentelemetry = { version = "=0.32.0", default-features = false, features = ["logs"] }
opentelemetry-http = { version = "=0.32.0", default-features = false }
opentelemetry-otlp = { version = "=0.32.0", default-features = false, features = ["grpc-tonic", "http-proto", "logs"] }
opentelemetry-proto = { version = "=0.32.0", default-features = false, features = ["gen-tonic", "logs", "trace"] }
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["logs"] }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "time"] }
tonic = { version = "=0.14.6", default-features = false, features = ["router", "transport", "tls-ring"] }
tracing = "=0.1.44"
tracing-loki = { version = "=0.2.7", default-features = false, features = ["compat-0-2-1"] }
tracing-subscriber = { version = "=0.3.22", default-features = false, features = ["registry"] }

[[test]]
name = "instance_bootstrap"
path = "tests/instance_bootstrap.rs"

[[test]]
name = "process_lifecycle"
path = "tests/process_lifecycle.rs"

[[test]]
name = "native_transport"
path = "tests/native_transport.rs"

[[test]]
name = "process_forced"
path = "tests/process_forced.rs"

[[test]]
name = "process_registration"
path = "tests/process_registration.rs"

[[test]]
name = "listener_contract"
path = "tests/listener_contract.rs"

[[test]]
name = "otlp_logs_grpc"
path = "tests/otlp_logs_grpc.rs"

[[test]]
name = "otlp_logs_http"
path = "tests/otlp_logs_http/tests/mod.rs"


[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["pipe"] }

[lints]
workspace = true
