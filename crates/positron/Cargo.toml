[package]
name = "positron"
description = "Positron binary and composition-root scaffold"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
positron-api = { path = "../positron-api" }
positron-backup = { path = "../positron-backup" }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
positron-config = { path = "../positron-config" }
positron-domain = { path = "../positron-domain" }
positron-governance = { path = "../positron-governance" }
positron-kernel = { path = "../positron-kernel" }
positron-runtime = { path = "../positron-runtime" }
positron-release = { path = "../positron-release" }
signal-hook = "=0.3.18"
age = { version = "0.11.5", features = ["armor"], default-features = false }
sha2 = "0.10.9"
hmac = "0.12.1"
rand = "0.8.5"
tar = { version = "0.4.46", default-features = false }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "=1.0.150"
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std", "termios"] }
tokio = { version = "=1.53.1", default-features = false, features = ["net", "rt", "time"] }

[target.'cfg(unix)'.dependencies]
close_fds = "=0.3.2"

[dev-dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["pty"] }
pgp = { version = "=0.21.0", default-features = false }
signed_note = "=0.2.0"
sigstore-merkle = { version = "=0.15.0", default-features = false }
cms = { version = "=0.2.3", default-features = false }
zip = { version = "=9.0.4", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
rcgen = { version = "=0.13.2", default-features = false, features = ["aws_lc_rs", "pem"] }
x509-cert = "=0.2.5"
sigstore-verify = { version = "=0.15.0", default-features = false, features = ["aws-lc-rs"] }
base64 = "=0.22.1"
ring = { version = "=0.17.14", default-features = false }
opentelemetry-proto = { version = "=0.32.0", default-features = false, features = ["gen-tonic", "logs"] }
tonic = { version = "=0.14.6", default-features = false, features = ["transport", "codegen"] }
positron-query = { path = "../positron-query" }
positron-runtime = { path = "../positron-runtime", features = ["test-support"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }

[lib]
name = "positron"
path = "src/lib.rs"

[[test]]
name = "process_exit"
path = "tests/process_exit.rs"

[lints]
workspace = true
