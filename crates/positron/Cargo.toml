[package]
name = "positron"
description = "Positron binary and composition-root scaffold"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
positron-api = { path = "../positron-api" }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
positron-config = { path = "../positron-config" }
positron-domain = { path = "../positron-domain" }
positron-governance = { path = "../positron-governance" }
positron-kernel = { path = "../positron-kernel" }
positron-runtime = { path = "../positron-runtime" }
signal-hook = "=0.3.18"
age = { version = "0.11.5", features = ["armor"], default-features = false }
sha2 = "0.10.9"
hmac = "0.12.1"
rand = "0.8.5"
tar = { version = "0.4.46", default-features = false }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "=1.0.149"
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
positron-runtime = { path = "../positron-runtime", features = ["test-support"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }

[lib]
name = "positron"
path = "src/lib.rs"

[[test]]
name = "process_exit"
path = "tests/process_exit.rs"

[lints]
workspace = true
