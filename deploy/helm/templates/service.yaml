apiVersion: v1
kind: Service
metadata:
  name: {{ include "positron.name" . }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: positron}
  ports:
    - {name: api, port: 8080, targetPort: api}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: loki-push, port: 3100, targetPort: loki-push}
