# Generated from `crates/positron-config/src/contract.rs`.
# Protected references are intentionally omitted.

schema_version = 1

[diagnostics]
log_level = "info"
trace_otlp_grpc_address = "disabled"

[listener]
control_path = "/var/run/positron/control.sock"
admission_rate_per_second = 1024
per_address_admission_rate_per_second = 128
operations_bind_address = "127.0.0.1:13133"
operations_transport = "tls"
operations_accepted_socket_limit = 128
operations_per_address_accepted_socket_limit = 16
operations_tls_handshake_limit = 16
operations_tls_handshake_deadline_seconds = 2
operations_header_deadline_seconds = 2
operations_body_deadline_seconds = 2
operations_request_deadline_seconds = 30
operations_idle_deadline_seconds = 30
api_bind_address = "127.0.0.1:8080"
api_transport = "tls"
api_accepted_socket_limit = 128
api_per_address_accepted_socket_limit = 16
api_tls_handshake_limit = 16
api_tls_handshake_deadline_seconds = 2
api_header_deadline_seconds = 2
api_body_deadline_seconds = 2
api_request_deadline_seconds = 30
api_idle_deadline_seconds = 30
api_http2_max_concurrent_streams = 1
api_http2_initial_stream_window_bytes = 65535
api_http2_initial_connection_window_bytes = 65535
api_http2_max_frame_bytes = 16384
api_http2_max_header_list_bytes = 8192
api_http2_minimum_ping_interval_seconds = 5
otlp_grpc_bind_address = "127.0.0.1:4317"
otlp_grpc_transport = "tls"
otlp_grpc_accepted_socket_limit = 128
otlp_grpc_per_address_accepted_socket_limit = 16
otlp_grpc_tls_handshake_limit = 16
otlp_grpc_tls_handshake_deadline_seconds = 2
otlp_grpc_header_deadline_seconds = 2
otlp_grpc_body_deadline_seconds = 2
otlp_grpc_request_deadline_seconds = 30
otlp_grpc_idle_deadline_seconds = 30
otlp_grpc_http2_max_concurrent_streams = 16
otlp_grpc_http2_initial_stream_window_bytes = 65535
otlp_grpc_http2_initial_connection_window_bytes = 65535
otlp_grpc_http2_max_frame_bytes = 16384
otlp_grpc_http2_max_header_list_bytes = 8192
otlp_grpc_http2_minimum_ping_interval_seconds = 5
otlp_grpc_max_message_bytes = 1048576
otlp_http_bind_address = "127.0.0.1:4318"
otlp_http_transport = "tls"
otlp_http_accepted_socket_limit = 128
otlp_http_per_address_accepted_socket_limit = 16
otlp_http_tls_handshake_limit = 16
otlp_http_tls_handshake_deadline_seconds = 2
otlp_http_header_deadline_seconds = 2
otlp_http_body_deadline_seconds = 2
otlp_http_request_deadline_seconds = 30
otlp_http_idle_deadline_seconds = 30
loki_push_bind_address = "127.0.0.1:3100"
loki_push_transport = "tls"
loki_push_accepted_socket_limit = 128
loki_push_per_address_accepted_socket_limit = 16
loki_push_tls_handshake_limit = 16
loki_push_tls_handshake_deadline_seconds = 2
loki_push_header_deadline_seconds = 2
loki_push_body_deadline_seconds = 2
loki_push_request_deadline_seconds = 30
loki_push_idle_deadline_seconds = 30

[listener.operations]
trusted_proxy_cidrs = []
forwarded_hops = 0

[listener.api]
trusted_proxy_cidrs = []
forwarded_hops = 0

[listener.otlp_grpc]
trusted_proxy_cidrs = []
forwarded_hops = 0

[listener.otlp_http]
trusted_proxy_cidrs = []
forwarded_hops = 0

[listener.loki_push]
trusted_proxy_cidrs = []
forwarded_hops = 0

[runtime]
shutdown_grace_seconds = 30
max_registered_tenants = 2

[storage]
data_directory = "/var/lib/positron"
secrets_directory = "/var/lib/positron-secrets"
