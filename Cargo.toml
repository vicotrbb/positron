[workspace]
members = [
    "crates/positron",
    "crates/positron-api",
    "crates/positron-config",
    "crates/positron-darwin-acl",
    "crates/positron-darwin-system",
    "crates/positron-domain",
    "crates/positron-governance",
    "crates/positron-ingest",
    "crates/positron-kernel",
    "crates/positron-policy",
    "crates/positron-query",
    "crates/positron-runtime",
    "crates/positron-signals",
]
resolver = "3"
exclude = ["vendor/aws-types-1.6.0", "vendor/aws-config-1.12.0", "vendor/google-cloud-auth-1.17.0", "vendor/reqwest-0.12.28", "vendor/ring-0.17.14"]

[patch.crates-io]
aws-types = { path = "vendor/aws-types-1.6.0" }
aws-config = { path = "vendor/aws-config-1.12.0" }
google-cloud-auth = { path = "vendor/google-cloud-auth-1.17.0" }
reqwest = { path = "vendor/reqwest-0.12.28" }
ring = { path = "vendor/ring-0.17.14" }

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96.0"
authors = ["Guara Cloud"]
license = "MIT"
repository = "https://github.com/guaracloud/positron"
homepage = "https://github.com/guaracloud/positron"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
