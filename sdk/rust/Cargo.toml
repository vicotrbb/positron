[package]
name = "positron-sdk"
description = "Generated typed Rust client for the Positron v1 public API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = true
readme = "README.md"
include = ["src/**", "api/**", "build_support/**", "build.rs", "Cargo.toml", "README.md", "LICENSE", "tests/**/*.rs", "tests/fixtures/**/*.json", "tests/fixtures/**/*.pem", "tests/fixtures/**/*.py", "examples/*.rs"]

[dependencies]
prost = "=0.14.3"
pbjson = "=0.9.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }
sha2 = { version = "=0.11.0", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[build-dependencies]
pbjson-build = "=0.9.0"
prost-build = "=0.14.3"
prost = "=0.14.3"
prost-types = "=0.14.3"
protoc-bin-vendored = "=3.2.0"
serde_json = "=1.0.150"
sha2 = { version = "=0.11.0", default-features = false }

[lints]
workspace = true

[package.metadata.positron]
api_version = "positron.v1"
schema_digest = "413f1f3eb9cfef33bde9701c670dfa33808d4896042d14ca0713eabd151bdddf"
release_manifest_surface = "SdkRust"
registry = "https://crates.io"
generator = "prost=0.14.3,pbjson=0.9.0,protoc-bin-vendored=3.2.0"
