// Canonical Positron public API definition. The committed Rust, HTTP/JSON,
// OpenAPI, schema, reference, and fixture artifacts change with this contract.
syntax = "proto3";

package positron.v1;

// Capability negotiation is the public foundation used before any later
// versioned service sends a request whose semantics the peer cannot support.
service CapabilityService {
  rpc Negotiate(CapabilityRequest) returns (CapabilityResponse);
}

// Authenticated System Administration API. Bearer credentials are transport
// metadata and are never included in request bodies. Tenant authority is
// selected only by the server's durable identity, never by a caller hint.
service ApiKeyService {
  rpc Manage(ApiKeyRequest) returns (ApiKeyResponse);
}

// Authenticated tenant-scoped quota administration. The bearer determines
// authority and must be bound to the named control-plane tenant.
service TenantQuotaService {
  rpc Update(TenantQuotaUpdateRequest) returns (TenantQuotaUpdateResponse);
}

// Authenticated system-administration lifecycle transitions for one explicit
// tenant. The target is never inferred from a bearer or a request hint.
service TenantLifecycleService {
  rpc Transition(TenantLifecycleTransitionRequest) returns (TenantLifecycleTransitionResponse);
}

// One immutable, protocol-specific compatibility binding for an explicit
// tenant. It validates a hint after credential attribution; it never routes
// traffic or selects tenant authority.
service TenantAliasService {
  rpc Bind(TenantAliasBindRequest) returns (TenantAliasBindResponse);
}

// Authenticated tenant retention inspection and confirmed publication. The
// preview is read-only evidence; a reduction submits only its opaque digest,
// which the server recomputes from current canonical state before mutation.
service TenantRetentionService {
  rpc Preview(TenantRetentionPreviewRequest) returns (TenantRetentionPreviewResponse);
  rpc Update(TenantRetentionUpdateRequest) returns (TenantRetentionUpdateResponse);
}

// Authenticated system-administration inspection of the one Storage Kernel
// Maintenance Coordinator. Task control remains in the coordinator.
service MaintenanceService {
  rpc Status(MaintenanceStatusRequest) returns (MaintenanceStatusResponse);
  rpc Explain(MaintenanceExplainRequest) returns (MaintenanceExplainResponse);
  rpc Run(MaintenanceRunRequest) returns (MaintenanceRunResponse);
  rpc Pause(MaintenancePauseRequest) returns (MaintenanceControlResponse);
  rpc Resume(MaintenanceResumeRequest) returns (MaintenanceControlResponse);
  rpc Window(MaintenanceWindowRequest) returns (MaintenanceWindowResponse);
}

// Authenticated system administration for explicit tenant registry entries.
// Tenant identity is always explicit and is never inferred from a bearer.
service TenantService {
  rpc Create(TenantCreateRequest) returns (TenantCreateResponse);
  rpc Inspect(TenantInspectRequest) returns (TenantInspectResponse);
  rpc List(TenantListRequest) returns (TenantListResponse);
  rpc UpdateDisplayName(TenantDisplayNameUpdateRequest) returns (TenantDisplayNameUpdateResponse);
}

// Authenticated tenant policy preview. This operation compiles a bounded
// prospective policy and never activates or mutates it.
service PolicyService {
  rpc Validate(PolicyPreviewRequest) returns (PolicyValidateResponse);
  rpc Test(PolicyTestRequest) returns (PolicyTestResponse);
  rpc Diff(PolicyDiffRequest) returns (PolicyDiffResponse);
  rpc Explain(PolicyExplainRequest) returns (PolicyExplainResponse);
  rpc Activate(PolicyActivateRequest) returns (PolicyActivateResponse);
}

message PolicyPreviewRequest {
  string policy_json = 1;
}

message PolicyValidateResponse {
  uint64 policy_generation = 1;
  string policy_digest = 2;
  uint32 rule_count = 3;
}

message PolicyTestRequest {
  string policy_json = 1;
  string candidate_json = 2;
}

message PolicyTestResponse {
  uint64 policy_generation = 1;
  string policy_digest = 2;
  bool accepted = 3;
  uint32 applied_rule_count = 4;
}

message PolicyDiffRequest {
  string before_policy_json = 1;
  string after_policy_json = 2;
}

message PolicyDiffResponse {
  uint64 before_policy_generation = 1;
  string before_policy_digest = 2;
  uint64 after_policy_generation = 3;
  string after_policy_digest = 4;
  repeated string semantic_changes = 5;
}

message PolicyExplainRequest {
  string policy_json = 1;
  string candidate_json = 2;
}

message PolicyExplainResponse {
  uint64 policy_generation = 1;
  string policy_digest = 2;
  string outcome = 3;
  string explanation = 4;
}

message PolicyActivateRequest {
  string policy_json = 1;
  uint64 expected_generation = 2;
  string idempotency_key = 3;
}

message PolicyActivateResponse {
  uint64 resource_generation = 1;
  string policy_digest = 2;
  uint64 audit_position = 3;
}


enum TenantLifecycleTarget {
  TENANT_LIFECYCLE_TARGET_UNSPECIFIED = 0;
  TENANT_LIFECYCLE_TARGET_ACTIVE = 1;
  TENANT_LIFECYCLE_TARGET_READ_ONLY = 2;
  TENANT_LIFECYCLE_TARGET_SUSPENDED = 3;
  TENANT_LIFECYCLE_TARGET_PURGING = 4;
  TENANT_LIFECYCLE_TARGET_PURGED = 5;
}

message TenantLifecycleTransitionRequest {
  string tenant = 1;
  TenantLifecycleTarget target = 2;
  uint64 expected_generation = 3;
  string idempotency_key = 4;
}

message TenantLifecycleTransitionResponse {
  string tenant = 1;
  TenantLifecycleTarget from = 2;
  TenantLifecycleTarget to = 3;
  uint64 lifecycle_generation = 4;
  uint64 audit_position = 5;
  uint64 audit_ingest_time_unix_seconds = 6;
}

message TenantAliasBindRequest {
  string tenant = 1;
  string external_alias = 2;
  uint64 expected_generation = 3;
  string idempotency_key = 4;
}

message TenantAliasBindResponse {
  string tenant = 1;
  uint64 alias_generation = 2;
  uint64 audit_position = 3;
  uint64 audit_ingest_time_unix_seconds = 4;
}

message TenantRetentionPreviewRequest {
  string tenant = 1;
  uint64 proposed_retention_seconds = 2;
  optional string continuation = 3;
}

message TenantRetentionScopeImpact {
  string signal = 1;
  uint32 shard = 2;
  string catalog_identity = 3;
  uint64 catalog_generation = 4;
  sint64 evaluated_at_unix_nanos = 5;
  optional sint64 affected_start_unix_nanos = 6;
  optional sint64 affected_end_unix_nanos = 7;
  uint64 affected_bytes = 8;
  uint64 immediately_reclaimable_bytes = 9;
  uint64 deferred_active_segment_bytes = 10;
  uint64 deferred_mixed_sealed_segment_bytes = 11;
  RetentionReclamation earliest_reclamation = 12;
  optional sint64 earliest_reclamation_unix_nanos = 13;
}

enum RetentionReclamation {
  RETENTION_RECLAMATION_NONE = 0;
  RETENTION_RECLAMATION_AT = 1;
  RETENTION_RECLAMATION_BLOCKED_BY_DURABLE_LEASE = 2;
  RETENTION_RECLAMATION_BLOCKED_BY_IN_PROCESS_SNAPSHOT = 3;
}

message TenantRetentionPreviewResponse {
  string tenant = 1;
  uint64 retention_generation = 2;
  uint64 proposed_retention_seconds = 3;
  string catalog_identity = 4;
  uint64 catalog_generation = 5;
  string confirmation_digest = 6;
  repeated TenantRetentionScopeImpact scopes = 7;
  optional string continuation = 8;
  sint64 confirmation_evaluated_at_unix_nanos = 9;
}

message TenantRetentionUpdateRequest {
  string tenant = 1;
  uint64 proposed_retention_seconds = 2;
  uint64 expected_generation = 3;
  optional string confirmation_digest = 4;
  string idempotency_key = 5;
  optional sint64 confirmation_evaluated_at_unix_nanos = 6;
}

message TenantRetentionUpdateResponse {
  string tenant = 1;
  uint64 retention_generation = 2;
  uint64 audit_position = 3;
  uint64 audit_ingest_time_unix_seconds = 4;
}

message TenantCreateRequest {
  reserved 1;
  string slug = 2;
  string display_name = 3;
  uint64 retention_seconds = 4;
  uint32 weight = 5;
  uint64 memory_bytes = 6;
  uint64 queue_slots = 7;
  uint64 task_slots = 8;
  uint64 buffer_cache_bytes = 9;
  uint64 batch_items = 10;
  uint64 lease_slots = 11;
  uint64 retry_slots = 12;
  uint64 io_permits = 13;
  uint64 cpu_work_units = 14;
  uint64 file_descriptors = 15;
  uint64 disk_headroom_bytes = 16;
  string idempotency_key = 17;
}

message TenantCreateResponse {
  string tenant = 1;
  uint64 resource_generation = 2;
  uint64 audit_position = 3;
}

message TenantInspectRequest {
  string tenant = 1;
}

message TenantListRequest {
  optional string continuation = 1;
}

message TenantDescriptor {
  string tenant = 1;
  string slug = 2;
  string display_name = 3;
  uint64 retention_seconds = 4;
  uint64 display_generation = 5;
  uint64 retention_generation = 6;
  TenantLifecycleTarget lifecycle = 7;
}

message TenantInspectResponse {
  TenantDescriptor tenant = 1;
}

message TenantListResponse {
  repeated TenantDescriptor tenants = 1;
  optional string continuation = 2;
}

message TenantDisplayNameUpdateRequest {
  string tenant = 1;
  uint64 expected_display_generation = 2;
  string display_name = 3;
  string idempotency_key = 4;
}

message TenantDisplayNameUpdateResponse {
  string tenant = 1;
  uint64 display_generation = 2;
  uint64 audit_position = 3;
}

message TenantQuotaUpdateRequest {
  string tenant = 1;
  uint64 expected_generation = 2;
  string idempotency_key = 3;
  uint32 weight = 4;
  uint64 memory_bytes = 5;
  uint64 queue_slots = 6;
  uint64 task_slots = 7;
  uint64 buffer_cache_bytes = 8;
  uint64 batch_items = 9;
  uint64 lease_slots = 10;
  uint64 retry_slots = 11;
  uint64 io_permits = 12;
  uint64 cpu_work_units = 13;
  uint64 file_descriptors = 14;
  uint64 disk_headroom_bytes = 15;
}

message TenantQuotaUpdateResponse {
  uint64 resource_generation = 1;
}

message ApiKeyRequest {
  KeyAction action = 1;
  optional KeyScope scope = 2;
  optional string principal = 3;
  optional uint64 expires_at_unix_seconds = 4;
  optional uint64 expected_generation = 5;
  optional string idempotency_key = 6;
  // An explicit control-plane target for System Administration credential
  // lifecycle control. It never participates in data-plane attribution.
  optional string target_tenant = 7;
}
enum KeyAction {
  KEY_ACTION_UNSPECIFIED = 0;
  KEY_ACTION_CREATE = 1;
  KEY_ACTION_LIST = 2;
  KEY_ACTION_ROTATE = 3;
  KEY_ACTION_REVOKE = 4;
  KEY_ACTION_SCOPE_INSPECT = 5;
}
enum KeyScope {
  KEY_SCOPE_UNSPECIFIED = 0;
  KEY_SCOPE_INGEST = 1;
  KEY_SCOPE_QUERY = 2;
  KEY_SCOPE_TENANT_ADMINISTRATION = 3;
  KEY_SCOPE_SYSTEM_ADMINISTRATION = 4;
}
message KeyDescriptor {
  string principal = 1;
  KeyScope scope = 2;
  bool active = 3;
  optional uint64 expires_at_unix_seconds = 4;
  uint64 generation = 5;
}
message ApiKeyResponse {
  repeated KeyDescriptor keys = 1;
  optional string principal = 2;
  // Present only in the first successful create/rotate response. Idempotent
  // retries resolve the principal but never reconstruct or redisplay a secret.
  optional string secret = 3;
}

message CapabilityRequest {
  uint32 api_major = 1;
  Capability capability = 2;
}

// Status selects a bounded page from the coordinator's identity-ordered
// registry. An omitted cursor selects the first page; an omitted limit uses
// the published safe default. The cursor is the prior page's opaque task
// identity and never names a Catalog object.
message MaintenanceStatusRequest {
  optional string cursor = 1;
  optional uint32 limit = 2;
}

message MaintenanceTaskStatus {
  string identity = 1;
  string task_class = 2;
  string scope = 3;
  string phase = 4;
  uint64 submitted_at_unix_seconds = 5;
  optional uint64 checkpoint_sequence = 6;
  optional uint64 pause_until_unix_seconds = 7;
  bool cancellation_requested = 8;
  optional uint64 resource_generation = 9;
  optional MaintenanceResourceReservations reservations = 10;
  optional string blocked_precondition = 11;
  repeated string safe_actions = 12;
  optional uint64 backlog_age_seconds = 13;
  optional string conflict_owner = 14;
  optional uint32 checkpoint_completed_inputs = 15;
  uint32 input_object_count = 16;
  uint32 output_object_count = 17;
  optional uint32 estimated_output_object_amplification_milli = 18;
  optional string terminal_outcome = 19;
  optional MaintenanceResourceReservations expected_foreground_impact = 20;
  optional string terminal_failure_class = 21;
  optional uint64 maintenance_window_until_unix_seconds = 22;
  // Unix epoch (0) is a valid trusted durable-progress instant.
  optional uint64 last_progress_at_unix_seconds = 23;
  optional bool no_durable_progress_slo_breached = 24;
  optional uint64 no_durable_progress_slo_seconds = 25;
  // Current coordinator-owned authority for this task's declared reservation:
  // foreground_reservation or recovery_reserve.
  optional string capacity_risk = 26;
  // Current lifecycle safety consequence. Omitted when no such fact applies.
  optional string retention_impact = 27;
  optional string recovery_impact = 28;
  // Server-owned earliest time at which every active finite deferral permits
  // execution. This is the later expiry when a pause and window overlap.
  optional uint64 automatic_resume_at_unix_seconds = 29;
}

// A task's coordinator-derived peak Resource Governor reservation. This is
// redacted to bounded aggregate amounts and never contains object identities.
message MaintenanceResourceReservations {
  uint64 memory_bytes = 1;
  uint64 queue_slots = 2;
  uint64 task_slots = 3;
  uint64 buffer_cache_bytes = 4;
  uint64 batch_items = 5;
  uint64 lease_slots = 6;
  uint64 retry_slots = 7;
  uint64 io_permits = 8;
  uint64 cpu_work_units = 9;
  uint64 file_descriptors = 10;
  uint64 disk_headroom_bytes = 11;
}

message MaintenanceStatusResponse {
  repeated MaintenanceTaskStatus tasks = 1;
  uint32 queued = 2;
  uint32 running = 3;
  uint32 deferred = 4;
  uint32 terminal = 5;
  uint32 returned = 6;
  uint32 total = 7;
  optional string next_cursor = 8;
}

message MaintenanceExplainRequest {
  string identity = 1;
}

message MaintenanceExplainResponse {
  MaintenanceTaskStatus task = 1;
}

// An authenticated system-administration request for one explicit existing
// scope. Release 1 accepts only compaction; the Storage Kernel selects a
// sealed source and derives its retention bucket, inputs, preconditions, and
// reservations from authenticated Catalog state.
message MaintenanceRunRequest {
  string task_class = 1;
  string tenant = 2;
  string signal = 3;
  uint32 shard = 4;
  string idempotency_key = 5;
}

// Immutable acknowledgement of one durable task descriptor. Live phase,
// blocking, reservation and progress facts are exposed only by Status/Explain.
message MaintenanceTaskAcknowledgement {
  string identity = 1;
  string task_class = 2;
  string scope = 3;
  uint64 submitted_at_unix_seconds = 4;
}

message MaintenanceRunResponse {
  MaintenanceTaskAcknowledgement task = 1;
  uint64 resource_generation = 2;
}

// Defers only one existing optional task for a bounded server-derived
// duration. The resource generation fences the immutable task preconditions.
message MaintenancePauseRequest {
  string identity = 1;
  uint64 resource_generation = 2;
  uint64 duration_seconds = 3;
  string idempotency_key = 4;
}

// Removes one existing durable pause. The server never accepts an expiry or
// other scheduling input from a caller.
message MaintenanceResumeRequest {
  string identity = 1;
  string idempotency_key = 2;
}

message MaintenanceControlResponse {
  MaintenanceTaskAcknowledgement task = 1;
  uint64 audit_position = 2;
  string action = 3;
  optional uint64 resource_generation = 4;
  optional uint64 pause_until_unix_seconds = 5;
}

// Defers a closed set of optional maintenance classes until a duration derived
// from the server Lifecycle Clock. The expected Catalog generation fences the
// one global window against concurrent operator changes.
message MaintenanceWindowRequest {
  repeated string deferred_classes = 1;
  uint64 expected_catalog_generation = 2;
  uint64 duration_seconds = 3;
  string idempotency_key = 4;
}

message MaintenanceWindowResponse {
  repeated string deferred_classes = 1;
  uint64 until_unix_seconds = 2;
  uint64 catalog_generation = 3;
  uint64 audit_position = 4;
}

message CapabilityResponse {
  uint32 api_major = 1;
  string schema_digest = 2;
  CapabilityAvailability availability = 3;
  PublicError refusal = 4;
  DeprecationState deprecation = 5;
  Capability capability = 6;
}

// Unspecified preserves additive compatibility with older v1 clients, whose
// negotiation request means the canonical public interface itself.
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_CANONICAL_PUBLIC_INTERFACE = 1;
  CAPABILITY_RELEASE_ONE_QUERY = 2;
  CAPABILITY_METRICS = 3;
}

enum CapabilityAvailability {
  CAPABILITY_AVAILABILITY_UNSPECIFIED = 0;
  CAPABILITY_AVAILABILITY_IMPLEMENTED = 1;
  CAPABILITY_AVAILABILITY_UNAVAILABLE = 2;
  CAPABILITY_AVAILABILITY_UNSUPPORTED = 3;
  CAPABILITY_AVAILABILITY_VERSION_INCOMPATIBLE = 4;
}

enum RetryClass {
  RETRY_CLASS_UNSPECIFIED = 0;
  RETRY_CLASS_NEVER = 1;
  RETRY_CLASS_AFTER_BACKOFF = 2;
  RETRY_CLASS_AFTER_INPUT_CORRECTION = 3;
}

enum CompletionState {
  COMPLETION_STATE_UNSPECIFIED = 0;
  COMPLETION_STATE_REJECTED = 1;
}

enum DeprecationState {
  DEPRECATION_STATE_UNSPECIFIED = 0;
  DEPRECATION_STATE_CURRENT = 1;
  DEPRECATION_STATE_DEPRECATED = 2;
}

message PublicError {
  PublicErrorCode code = 1;
  RetryClass retry_class = 2;
  CompletionState completion_state = 3;
  FailureSource source = 4;
  SafeDetail safe_detail = 5;
}

enum PublicErrorCode {
  PUBLIC_ERROR_CODE_UNSPECIFIED = 0;
  PUBLIC_ERROR_CODE_UNSUPPORTED_API_VERSION = 1;
  PUBLIC_ERROR_CODE_CAPABILITY_UNAVAILABLE = 2;
  PUBLIC_ERROR_CODE_CAPABILITY_UNSUPPORTED = 3;
  PUBLIC_ERROR_CODE_MALFORMED_REQUEST = 4;
  PUBLIC_ERROR_CODE_REQUEST_TOO_LARGE = 5;
  PUBLIC_ERROR_CODE_UNKNOWN_FIELD = 6;
}

enum FailureSource {
  FAILURE_SOURCE_UNSPECIFIED = 0;
  FAILURE_SOURCE_CAPABILITY_NEGOTIATION = 1;
  FAILURE_SOURCE_GRPC_DECODE = 2;
  FAILURE_SOURCE_HTTP_DECODE = 3;
}

enum SafeDetail {
  SAFE_DETAIL_UNSPECIFIED = 0;
  SAFE_DETAIL_API_MAJOR_UNSUPPORTED = 1;
  SAFE_DETAIL_CAPABILITY_NOT_AVAILABLE = 2;
  SAFE_DETAIL_CAPABILITY_NOT_SUPPORTED = 3;
  SAFE_DETAIL_REQUEST_MALFORMED = 4;
  SAFE_DETAIL_REQUEST_LIMIT_EXCEEDED = 5;
  SAFE_DETAIL_FIELD_NOT_RECOGNIZED = 6;
}
